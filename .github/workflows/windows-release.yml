name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft release tag (must match app version)
        required: true
        default: v0.1.3

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: pwsh
        run: |
          $version = python -c "from app import VERSION; print(VERSION)"
          if ($LASTEXITCODE -ne 0 -or $env:RELEASE_TAG -ne "v$version") { throw "Release tag must match app.VERSION" }
      - name: Check behavior and native Windows widget
        run: |
          python -m unittest discover -p test_model.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python verify.py
      - name: Build installer and portable app
        run: ./build_windows.ps1
      - name: Test portable launch, install, installed launch and uninstall
        run: python verify_windows_package.py
      - name: Attach verified packages to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: pwsh
        run: gh release upload $env:RELEASE_TAG release/* --clobber
